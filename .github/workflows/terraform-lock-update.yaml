---
name: Update the terraform lock file to work on both platforms

on:
  pull_request:

jobs:
  terraform-lock-update:
    permissions:
      contents: read
    runs-on: ubuntu-slim
    steps:
      - uses: UCL-MIRSG/.github/actions/terraform-lock-update@15e7b1d799e83c59e7e193210f2a21eb48b81fce # v0
        with:
          app-id: ${{ vars.TERRAFORM_LOCK_UPDATE_APP_ID }}
          app-pem: ${{ secrets.TERRAFORM_LOCK_UPDATE_APP_PRIVATE_KEY }} # zizmor: ignore[secrets-outside-env]
